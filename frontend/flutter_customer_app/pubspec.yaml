name: justfiber_customer_app
description: Modern customer app for JustFiber built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  latlong2: ^0.9.1
  razorpay_flutter: ^1.4.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  webview_flutter: ^4.9.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
