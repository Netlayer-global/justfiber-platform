name: justfiber_installer_app
description: Modern installer field app for JustFiber.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.1.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
