<VirtualHost *:80>
    ServerName api.justfiber.in
    ServerAlias admin.justfiber.in noc.justfiber.in sales.justfiber.in user.justfiber.in

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.justfiber.in

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.justfiber.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.justfiber.in/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.justfiber.in
    ServerAlias noc.justfiber.in sales.justfiber.in user.justfiber.in

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.justfiber.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.justfiber.in/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
</IfModule>
